version: '3.8'

services:
  mongodb:
    image: mongo:7-jammy
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: campus_it_helpdesk
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/campus_it_helpdesk
      JWT_SECRET: super_secure_campus_it_jwt_secret_key_2026_final_year
      NODE_ENV: production
    depends_on:
      - mongodb

volumes:
  mongo_data:
